<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Partance</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='11.5' fill='none' stroke='%238C1D40' stroke-width='2.4' stroke-dasharray='3 2.2'/%3E%3Cpath d='M7.5 16.5 L18.5 8.5 M18.5 8.5 L13.6 8.6 M18.5 8.5 L17.3 13.2' stroke='%238C1D40' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli à onglets. En-tête collant, offres en lignes façon carte d'embarquement (score à gauche, code ville à droite), fiche détaillée en tiroir latéral. */
:root{
  --bg:#F2F2F6; --surface:#FFFFFF; --sunk:#E7E7EE; --ink:#16192B; --muted:#5E6278; --line:#DCDCE6;
  --accent:#8C1D40; --accent-ink:#FFFFFF; --accent-soft:#F6E4EA;
  --good:#1D7A4E; --good-soft:#E0F1E7; --warn:#9A5F00; --warn-soft:#F9EDD6; --bad:#B42A21; --bad-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(22,25,43,.06),0 10px 30px rgba(22,25,43,.12);
  --scrim:rgba(22,25,43,.35);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1118; --surface:#181B25; --sunk:#232735; --ink:#E9EAF1; --muted:#9A9EB3; --line:#2A2E3D;
  --accent:#E8839F; --accent-ink:#1A0A10; --accent-soft:#3A1D29;
  --good:#5FCB93; --good-soft:#14301F; --warn:#E7B45A; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1118; --surface:#181B25; --sunk:#232735; --ink:#E9EAF1; --muted:#9A9EB3; --line:#2A2E3D;
  --accent:#E8839F; --accent-ink:#1A0A10; --accent-soft:#3A1D29;
  --good:#5FCB93; --good-soft:#14301F; --warn:#E7B45A; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-stretch:118%;text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--ink);background:none;border:0;padding:0}
.brand svg{color:var(--accent);flex:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--sunk)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs .count{font-family:var(--mono);font-size:11.5px;margin-left:4px;opacity:.75}
.bell{position:relative;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.bell .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 11px/19px var(--mono);text-align:center}

.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
.foot{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 40px;font-size:12.5px;color:var(--muted)}

/* Intro offres */
.intro{display:grid;gap:10px;margin-bottom:20px}
.intro h1{font-size:clamp(26px,4.2vw,40px);font-weight:800;font-stretch:125%;letter-spacing:-.015em;max-width:22ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}

.profilebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:16px}
.profilebar .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:500;border:1px solid transparent}
.profilebar .spacer{flex:1}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* Filtres */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input[type="text"],input[type="search"],input[type="email"],input[type="number"],select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.55}
.listhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 10px;font-size:14px}
.listhead .n{font-family:var(--mono);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Lignes d'offres */
.list{display:grid;gap:8px}
.offer{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,transform .15s}
.offer:hover{border-color:var(--accent)}
.o-main{display:grid;gap:2px;min-width:0}
.o-title{font-weight:700;font-size:15.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.o-sub{color:var(--muted);font-size:13.5px}
.o-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.urgent{color:var(--bad);font-weight:600}
.o-side{display:grid;justify-items:end;gap:6px;border-left:1px dashed var(--line);padding-left:16px}
.code{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:24px;letter-spacing:.02em;line-height:1}
.src{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.src.bf{background:var(--sunk);color:var(--ink)}
.src.carriere{background:var(--accent-soft);color:var(--accent)}
.pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;text-transform:uppercase}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.pill.app{background:var(--good-soft);color:var(--good)}
.dial{display:block;flex:none}
.dial.good{color:var(--good)} .dial.warn{color:var(--warn)} .dial.bad{color:var(--bad)}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* Tiroir */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:50;overflow-y:auto;box-shadow:var(--shadow);padding:calc(env(safe-area-inset-top,0px) + 16px) 24px calc(env(safe-area-inset-bottom,0px) + 28px)}
.d-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stamp{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stamp .code{font-size:40px;color:var(--accent)}
.drawer h2{font-size:24px;font-weight:800;margin:10px 0 4px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
.facts div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-family:var(--mono);font-weight:600;font-size:14px}
.scorebox{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.score-head{display:flex;align-items:center;gap:14px}
.score-head strong{font-size:17px;display:block}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.crit li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.partial{background:var(--warn-soft);color:var(--warn)} .ic.ko{background:var(--bad-soft);color:var(--bad)} .ic.na{background:var(--sunk);color:var(--muted)}
.crit .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-right:6px}
.crit .na-row{color:var(--muted)}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:22px 0 8px;font-family:var(--body)}
.drawer ul.miss{margin:0;padding-left:18px;display:grid;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.inapps{margin-top:18px;padding:10px 12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:14px}

/* Profil */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.card h2{font-size:19px;font-weight:800}
.pagehead{display:grid;gap:6px;margin-bottom:20px}
.pagehead h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;font-stretch:125%}
.pagehead p{margin:0;color:var(--muted);max-width:62ch}
.drop{display:grid;gap:4px;place-items:center;text-align:center;padding:22px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:15px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;padding:9px 12px;border-radius:9px}
.note.good{background:var(--good-soft);color:var(--good)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.langrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.chip button{border:0;background:none;padding:0;color:var(--muted);font-size:14px;line-height:1}
.chip button:hover{color:var(--bad)}
.addrow{display:flex;gap:8px}
.domchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted)}
.domchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500;margin-bottom:16px}
.banner .btn{margin-left:auto}

/* Candidatures */
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:16px}
.summary b{color:var(--ink);font-size:20px;font-family:var(--display);font-stretch:118%;margin-right:4px}
.relances{display:grid;gap:8px;margin-bottom:18px}
.relance{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);font-size:14px}
.relance .btn{margin-left:auto}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px;padding:2px 4px}
.col-h .mono{color:var(--muted);font-size:12px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:6px;min-width:0}
.app-t{font-weight:700;font-size:14px;line-height:1.3}
.app-s{font-size:12.5px;color:var(--muted)}
.app-d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.app-d.late{color:var(--warn);font-weight:600}
.app select{padding:5px 8px;font-size:13px;border-radius:7px}
.app-a{display:flex;gap:4px;flex-wrap:wrap}
.col .none{font-size:12.5px;color:var(--muted);padding:4px}

/* Alertes */
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
input[type="range"]{width:100%;accent-color:var(--accent)}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.mail-h{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:3px;font-size:13px;color:var(--muted)}
.mail-h strong{color:var(--ink);font-size:16px}
.mail-b{padding:18px;display:grid;gap:12px}
.mail-o{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left;background:var(--surface);width:100%}
.mail-o:hover{border-color:var(--accent)}
.mail-o .why{font-size:13px;color:var(--muted)}
.mail-o .why b{color:var(--good);font-weight:600}
.mail-o .why i{color:var(--bad);font-style:normal;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .field:first-child{grid-column:1/-1}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .top-in{gap:10px;padding:8px 16px}
  .brand span{display:none}
  .wrap{padding-inline:16px;padding-block:20px 56px}
  .foot{padding-inline:16px}
  .offer{grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px}
  .o-side{grid-column:2;justify-items:start;display:flex;align-items:center;gap:10px;border-left:0;padding-left:0}
  .o-side .code{font-size:16px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer{padding-inline:16px}
  .row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ajouts version connectée */
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.dial.na{color:var(--muted)}
.srclist{display:grid;gap:2px}
.srcrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.srcrow:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)}
.srcerr{display:block;color:var(--bad);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.srcerr.warn{color:var(--warn)}
.codebox{margin:0;font-family:var(--mono);font-size:12px;background:var(--sunk);padding:10px 12px;border-radius:9px;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto}
.offer .o-side .src{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.score-head span{display:block}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="view" data-view="offres" aria-label="Partance, retour aux offres">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.2"/><path d="M7.5 16.5 L18.5 8.5 M18.5 8.5 L13.6 8.6 M18.5 8.5 L17.3 13.2" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Partance</span>
    </button>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <button class="bell" id="bell" data-act="bell" aria-label="Nouvelles offres">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="n" id="bellN" hidden></span>
    </button>
  </div>
</header>

<main class="wrap" id="main"><div class="empty">Chargement des offres…</div></main>
<p class="foot" id="foot">Partance, usage personnel. Offres récupérées sur le catalogue Business France et les sites carrière des entreprises. Ton profil et tes candidatures restent dans ce navigateur.</p>

<div class="scrim" id="scrim" data-act="close" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Détail de l'offre" hidden></aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- Référentiels ---------- */
const DOM = {fin:"Finance",biz:"Business development",ing:"Ingénierie",it:"IT & data",mkt:"Marketing & communication",sc:"Supply chain & achats",cons:"Conseil",rh:"RH",autre:"Autre"};
const LV = {A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
const NIV = {2:"Bac+2",3:"Bac+3",4:"Bac+4",5:"Bac+5"};

/* ---------- Utilitaires ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5;
const today = ()=>{const d=new Date(); d.setHours(0,0,0,0); return d;};
const isoLocal = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseLocal = s => {const [a,b,c]=s.slice(0,10).split("-").map(Number); return new Date(a,b-1,c);};
const daysSince = s => Math.round((today()-parseLocal(s))/DAY);
const daysUntil = s => Math.round((parseLocal(s)-today())/DAY);
const fmtDate = d => d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const eur = n => Math.round(n).toLocaleString("fr-FR")+" €";
const ago = n => n<=0?"aujourd'hui":n===1?"hier":`il y a ${n} j`;
function rel(isoStr){
  if(!isoStr) return "jamais";
  const m=Math.round((Date.now()-Date.parse(isoStr))/6e4);
  if(m<1) return "à l'instant"; if(m<60) return `il y a ${m} min`;
  const h=Math.round(m/60); if(h<24) return `il y a ${h} h`;
  const d=Math.round(h/24); return d===1?"hier":`il y a ${d} j`;
}
const yrs = y => y ? `${String(y).replace(".",",")} an${y>=2?"s":""}` : "";
const isNew = o => o.first_seen && Date.now()-Date.parse(o.first_seen) < DAY;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const wordRe = a => new RegExp("(^|[^a-z0-9à-ÿ])"+reEsc(a)+"(?=$|[^a-z0-9à-ÿ])","i");
function toast(msg){const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800);}
function dial(sc,size=48){
  const h=size/2, r=h-4, C=2*Math.PI*r;
  if(sc.s==null) return `<svg class="dial na" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Pas de score"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="4" stroke-dasharray="3 3"/><text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="${Math.round(size*.3)}">–</text></svg>`;
  const off=C*(1-sc.s/100);
  return `<svg class="dial ${sc.v.c}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score ${sc.s} sur 100"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="4"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="600" font-size="${Math.round(size*.3)}">${sc.s}</text></svg>`;
}
const ICON = {ok:"✓",partial:"≈",ko:"✕",na:"–"};
async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const el=$("#profilejson"); if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast("Copie bloquée : le texte est sélectionné, fais Ctrl+C."); }
}

/* ---------- Lecture du CV ---------- */
function levelIn(t){
  const m = t.match(/\b([abc][12])\b/i); if(m) return m[1].toUpperCase();
  if(/bilingue|natif|native|maternelle|mother tongue/.test(t)) return "C2";
  if(/courant|fluent|avancé|advanced|toeic 9/.test(t)) return "C1";
  if(/professionnel|professional|upper/.test(t)) return "B2";
  if(/intermédiaire|intermediate/.test(t)) return "B1";
  if(/notions|scolaire|basic|débutant|beginner/.test(t)) return "A2";
  return null;
}
function parseCV(raw){
  const t = raw.toLowerCase();
  const langues = [];
  for(const [name,aliases] of LANGS){
    let found=false, level=null;
    for(const a of aliases){
      const re = new RegExp(reEsc(a),"g"); let m;
      while((m=re.exec(t))){
        found=true;
        const lv = levelIn(t.slice(m.index+a.length, m.index+a.length+45).split(/[·|\n;•,]/)[0]); if(lv){level=lv;break;}
      }
      if(level) break;
    }
    if(found) langues.push({l:name,n:level||"B1"});
  }
  if(!langues.some(x=>x.l==="Français")) langues.push({l:"Français",n:"C2"});
  let niv = 0;
  if(/master|msc|mba|bac\s*\+\s*5|ingénieur|ingenieur|grande école|grande ecole/.test(t)) niv=5;
  else if(/bac\s*\+\s*4|maîtrise|\bm1\b/.test(t)) niv=4;
  else if(/licence|bachelor|bac\s*\+\s*3|\bbut\b/.test(t)) niv=3;
  else if(/\bbts\b|\bdut\b|bac\s*\+\s*2/.test(t)) niv=2;
  let age=null; const am = t.match(/\b(1[7-9]|[23][0-9]|40)\s*ans\b/); if(am) age=+am[1];
  let exp=0; const er=/\b(\d{1,2}(?:[.,]5)?)\s*(?:ans|années|annees|years?)\b/g; let em;
  while((em=er.exec(t))){const n=parseFloat(em[1].replace(",",".")); if(n<16&&n>exp) exp=n;}
  if(!exp && /alternance|apprentissage/.test(t)) exp=1;
  const comps=[];
  for(const [name,aliases] of Object.entries(SKILLS)){ if(aliases.some(a=>wordRe(a).test(t))) comps.push(name); }
  if(!comps.includes("Tableau") && /\bTableau\b(?!\s+de)/.test(raw)) comps.push("Tableau");
  if(comps.includes("Salesforce") && !comps.includes("CRM")) comps.push("CRM");
  const doms=[];
  for(const k of Object.keys(DOM)){ if(DOM_HINTS[k].some(s=>comps.includes(s)) || DOM_WORDS[k].test(t)) doms.push(k); }
  return {age,niv,exp,langues,comps,doms};
}

/* ---------- Score (même logique que collector/score.py) ---------- */
function score(o,p){
  if(!S.profileSet) return {s:null,L:[],v:{t:"Pas encore de profil",c:"na",sub:"Dépose ton CV dans « Mon profil » pour noter les offres."}};
  const L=[]; let W=0,E=0;
  const ol=o.langues||[], oc=o.comps||[];
  if(ol.length){
    let sub=0;
    for(const r of ol){
      const h=p.langues.find(x=>x.l===r.l), hv=h?LV[h.n]:0, rv=LV[r.n]||4;
      let st="ko",pts=0; if(hv>=rv){st="ok";pts=1} else if(hv&&rv-hv===1){st="partial";pts=.5}
      sub+=pts;
      L.push({st,cat:"Langue",need:`${r.l} ${r.n}`,have:h?`${h.n} sur ton CV`:"absent de ton CV",short:`${r.l} ${h?h.n:""}`.trim()});
    }
    W+=30; E+=30*sub/ol.length;
  } else L.push({st:"na",cat:"Langue",need:"Langues",have:"non précisées dans l'offre, non comptées"});
  if(o.niv){
    W+=20; const ok=(p.niv||0)>=o.niv; if(ok) E+=20;
    L.push({st:ok?"ok":"ko",cat:"Diplôme",need:NIV[o.niv],have:p.niv?`${NIV[p.niv]} sur ton CV`:"non renseigné",short:NIV[p.niv]});
  } else L.push({st:"na",cat:"Diplôme",need:"Niveau d'études",have:"non précisé dans l'offre, non compté"});
  if(oc.length){
    W+=30; let n=0;
    for(const c of oc){const ok=p.comps.includes(c); if(ok) n++; L.push({st:ok?"ok":"ko",cat:"Compétence",need:c,have:ok?"sur ton CV":"absent de ton CV",short:c});}
    E+=30*n/oc.length;
  } else L.push({st:"na",cat:"Compétences",need:"Compétences",have:"aucune repérée dans l'offre"});
  if(o.exp!=null){
    W+=10; const y=p.exp||0; let st="ko",pts=0; if(y>=o.exp){st="ok";pts=1} else if(y>0){st="partial";pts=.5}
    E+=10*pts;
    L.push({st,cat:"Expérience",need:o.exp?`${yrs(o.exp)} d'expérience`:"Première expérience",have:y?`${yrs(y)} sur ton CV`:"pas d'expérience sur ton CV",short:`${yrs(y)} d'expérience`});
  } else L.push({st:"na",cat:"Expérience",need:"Expérience",have:"non précisée dans l'offre, non comptée"});
  if(W===0) return {s:null,L,v:{t:"Pas assez d'infos",c:"na",sub:"L'annonce ne détaille pas ses exigences. Lis-la en entier."}};
  if(p.doms.length){
    W+=10; const ok=p.doms.includes(o.dom); if(ok) E+=10;
    L.push({st:ok?"ok":"ko",cat:"Domaine",need:DOM[o.dom]||"Autre",have:ok?"dans tes domaines visés":"hors de tes domaines visés",short:DOM[o.dom]});
  }
  const s=Math.round(100*E/W);
  return {s,L,v:verdict(s)};
}
function verdict(s){
  if(s>=85) return {t:"Très bon match",c:"good",sub:"Candidature recommandée"};
  if(s>=70) return {t:"Bon match",c:"good",sub:"Tu coches l'essentiel"};
  if(s>=50) return {t:"Match partiel",c:"warn",sub:"Quelques écarts à combler"};
  return {t:"Peu adapté",c:"bad",sub:"Trop d'écarts avec l'offre"};
}

/* ---------- Données ---------- */
async function loadData(first){
  try{
    const r=await fetch("data/offers.json?t="+Date.now(),{cache:"no-store"});

    DATA=await r.json(); OFFERS=DATA.offers||[]; LOAD_ERR=null;

  if(first) render();
  else { renderTabs(); if(UI.view==="offres"){renderStats(); renderList();} else if(UI.view==="alertes") renderAlertes(); }
}

  if(p.exp) bits.push(`${yrs(p.exp)} d'expérience`);
  p.doms.forEach(d=>bits.push(DOM[d]));

}

function filtered(){
  let rows = OFFERS.map(o=>({o,sc:score(o,S.profile)}));

  if(q) rows=rows.filter(({o})=>[o.titre,o.ent,o.ville,o.pays,(o.comps||[]).join(" "),DOM[o.dom],o.source,o.extrait].join(" ").toLowerCase().includes(q));
  if(UI.pays) rows=rows.filter(({o})=>o.iso===UI.pays);
  if(UI.dom) rows=rows.filter(({o})=>o.dom===UI.dom);
  if(UI.src) rows=rows.filter(({o})=>o.src===UI.src);
  if(UI.nouvelles) rows=rows.filter(({o})=>isNew(o));
  const sv = r => r.sc.s==null?-1:r.sc.s;
  const fs = r => Date.parse(r.o.first_seen)||0;
  const cmp = {score:(a,b)=>sv(b)-sv(a)||fs(b)-fs(a), new:(a,b)=>fs(b)-fs(a), clo:(a,b)=>(a.o.cloture||"9999").localeCompare(b.o.cloture||"9999"), ind:(a,b)=>(b.o.ind||0)-(a.o.ind||0)}[UI.tri];

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function handleFile(f){
  try{
    let text;
    if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){
      toast("Lecture du PDF…");
      if(!window.pdfjsLib){
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
        window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      const pdf = await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      text="";
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i); const c=await pg.getTextContent(); text+=c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n";}
    } else text = await f.text();
    if(!text.trim()) throw new Error("vide");
    applyCV(text);
  }catch(e){ toast("Impossible de lire ce fichier. Colle le texte de ton CV dans le champ."); }
}
function applyCV(text){
  if(!text.trim()){ toast("Le champ est vide : colle d'abord le texte de ton CV."); return; }
  const pays=S.profile.pays;
  S.cv=text; S.profile=parseCV(text); S.profile.pays=pays; S.profileSet=true; save();
  render();
  const p=S.profile;
  toast(`Profil mis à jour : ${p.langues.length} langue${p.langues.length>1?"s":""}, ${p.comps.length} compétence${p.comps.length>1?"s":""}`);
}

  return {secrets:`${base}/settings/secrets/actions`, actions:`${base}/actions`};
}

/* ---------- Routage et événements ---------- */
function render(){
  renderTabs();
  ({offres:renderOffres,profil:renderProfil,candidatures:renderCand,alertes:renderAlertes})[UI.view]();
  if(UI.open) renderDrawer();
}
function go(view){ UI.view=view; try{history.replaceState(null,"","#"+view)}catch(e){} if(UI.open) closeDrawer(); render(); window.scrollTo(0,0); }
function upsertApp(id,status){
  let a=appOf(id); const t=isoLocal(today());
  if(!a){a={id,status,date:null,updated:t,snap:snapOf(id)}; S.apps.push(a);}
  if(status==="postule"&&!a.date) a.date=t;
  if(status==="cible") a.date=null;
  a.status=status; a.updated=t; if(!a.snap) a.snap=snapOf(id); save();
}
function touchProfile(){ S.profileSet=true; save(); render(); }

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, p=S.profile;
  switch(act){
    case "view": go(b.dataset.view); break;
    case "bell": UI.nouvelles=true; UI.q="";UI.pays="";UI.dom="";UI.src=""; UI.tri="score"; go("offres"); break;
    case "toggle-new": UI.nouvelles=!UI.nouvelles; UI.limit=60; renderList(); break;
    case "reset-filters": UI.q="";UI.pays="";UI.dom="";UI.src="";UI.nouvelles=false; UI.limit=60; renderOffres(); break;
    case "more": UI.limit+=60; renderList(); break;
    case "open": openOffer(id); break;
    case "close": closeDrawer(); break;
    case "apply": upsertApp(id,"postule"); toast("Ajoutée à tes candidatures : Postulé"); render(); break;
    case "target": upsertApp(id,"cible"); toast("Gardée dans « À postuler »"); render(); break;
    case "app-remove": S.apps=S.apps.filter(a=>a.id!==id); save(); toast("Candidature retirée"); render(); break;
    case "relance": {const a=appOf(id); a.updated=isoLocal(today()); save(); toast("Relance notée. Prochain rappel dans 3 semaines."); render(); break;}
    case "parse": applyCV($("#cvtext").value); break;
    case "lang-add": {const used=p.langues.map(l=>l.l); const nx=LANGS.map(l=>l[0]).find(n=>!used.includes(n))||"Anglais"; p.langues.push({l:nx,n:"B1"}); touchProfile(); break;}
    case "lang-remove": p.langues.splice(+b.dataset.i,1); touchProfile(); break;
    case "comp-remove": p.comps=p.comps.filter(c=>c!==b.dataset.c); touchProfile(); break;
    case "comp-add": addComp(); break;
    case "dom": {const d=b.dataset.d; p.doms=p.doms.includes(d)?p.doms.filter(x=>x!==d):[...p.doms,d]; touchProfile(); break;}
    case "pays-add": {const v=$("#pays-new").value; if(v&&!p.pays.includes(v)){p.pays.push(v); save(); render();} break;}
    case "pays-remove": p.pays=p.pays.filter(x=>x!==b.dataset.i); save(); render(); break;
    case "copy-profile": copyText(profileExport(),"Profil copié. Colle-le dans le secret PROFILE_JSON."); break;
  }
});
function addComp(){
  const inp=$("#comp-new"); const v=inp.value.trim(); if(!v) return;
  const canon=Object.keys(SKILLS).find(k=>k.toLowerCase()===v.toLowerCase())||v;
  if(!S.profile.comps.includes(canon)) S.profile.comps.push(canon);
  touchProfile(); const n=$("#comp-new"); n&&n.focus();
}
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&UI.open) closeDrawer();

  const t=ev.target, p=S.profile;
  if(t.id==="f-pays"){UI.pays=t.value; UI.limit=60; renderList();}
  if(t.id==="f-dom"){UI.dom=t.value; UI.limit=60; renderList();}
  if(t.id==="f-src"){UI.src=t.value; UI.limit=60; renderList();}
  if(t.id==="f-tri"){UI.tri=t.value; renderList();}
  if(t.id==="p-age"){p.age=t.value===""?null:+t.value; save(); render();}
  if(t.id==="p-niv"){p.niv=+t.value; touchProfile();}
  if(t.id==="p-exp"){p.exp=+t.value||0; touchProfile();}
  if(t.dataset.lang!=null){p.langues[+t.dataset.lang][t.dataset.k]=t.value; touchProfile();}
  if(t.dataset.app){upsertApp(t.dataset.app,t.value); toast(`Statut : ${stLabel(t.value)}`); render();}
});

const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v[0]===h)) UI.view=h;
renderTabs();
loadData(true);
setInterval(()=>loadData(false), 5*60*1000);
</script>
</body>
</html>
