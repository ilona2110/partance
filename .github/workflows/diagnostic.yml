name: Diagnostic des sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Sonder les sources
        run: python collector/diagnostic.py
      - name: Publier le rapport sur la branche diagnostic
        run: |
          git config user.name "partance-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan diagnostic
          git rm -rq --cached .
          git add -f probe
          git commit -q -m "Rapport de diagnostic"
          git push -qf origin diagnostic
